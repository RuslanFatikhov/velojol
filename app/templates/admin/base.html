<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Админ-панель - VELOJOL{% endblock %}</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .header { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
        .nav { display: flex; gap: 20px; margin-bottom: 20px; }
        .nav a { padding: 10px 20px; background: #007bff; color: white; text-decoration: none; border-radius: 4px; }
        .content { background: white; padding: 20px; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Админ-панель VELOJOL</h1>
        <span>Админ: {{ current_user.nickname }}</span>
    </div>
    
    <nav class="nav">
        <a href="{{ url_for('admin.dashboard') }}">Дашборд</a>
        <a href="{{ url_for('admin.bikelanes') }}">Велодорожки</a>
        <a href="{{ url_for('main.index') }}">На сайт</a>
    </nav>
    
    <div class="content">
        {% block content %}{% endblock %}
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</body>
</html>
