{% extends "admin/base.html" %}

{% block content %}
<div style="margin-bottom: 20px;">
    <a href="{{ url_for('admin.view_bikelane', bikelane_id=bikelane.id) }}" style="background: #6c757d; color: white; padding: 8px var(--spacer-m); text-decoration: none; border-radius: 4px;">
        ← Назад к велодорожке
    </a>
</div>

<h2>Редактировать: {{ bikelane.title }}</h2>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
    <!-- Форма -->
    <div>
        <form method="post" id="editForm">
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Название:</label>
                <input type="text" name="title" value="{{ bikelane.title }}" required
                       style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Описание:</label>
                <textarea name="description" rows="4" required
                          style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">{{ bikelane.description }}</textarea>
            </div>
            
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Тип дорожки:</label>
                <select name="track_type" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
                    <option value="lane" {% if bikelane.track_type == 'lane' %}selected{% endif %}>Полоса</option>
                    <option value="bollards" {% if bikelane.track_type == 'bollards' %}selected{% endif %}>Полоса с боллардами</option>
                    <option value="separated" {% if bikelane.track_type == 'separated' %}selected{% endif %}>Обособленная велодорожка</option>
                    <option value="shared" {% if bikelane.track_type == 'shared' %}selected{% endif %}>Вело-пешеходная дорожка</option>
                </select>
            </div>
            
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Качество покрытия:</label>
                <select name="quality" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
                    <option value="1" {% if bikelane.quality == 1 %}selected{% endif %}>1 - Ужасно</option>
                    <option value="2" {% if bikelane.quality == 2 %}selected{% endif %}>2 - Плохо</option>
                    <option value="3" {% if bikelane.quality == 3 %}selected{% endif %}>3 - Средне</option>
                    <option value="4" {% if bikelane.quality == 4 %}selected{% endif %}>4 - Хорошо</option>
                    <option value="5" {% if bikelane.quality == 5 %}selected{% endif %}>5 - Отлично</option>
                </select>
            </div>
            
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Комментарий администратора:</label>
                <textarea name="admin_comment" rows="3" placeholder="Комментарий для пользователя..."
                          style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">{{ bikelane.admin_comment or '' }}</textarea>
            </div>
            
            <!-- Скрытое поле для геометрии -->
            <input type="hidden" name="geometry" id="geometryInput" value="{{ bikelane.geometry }}">
            
            <div style="display: flex; gap: 10px;">
                <button type="submit" style="background: #007bff; color: white; border: none; padding: 12px var(--spacer-l); border-radius: 4px; cursor: pointer;">
                    Сохранить изменения
                </button>
                <a href="{{ url_for('admin.view_bikelane', bikelane_id=bikelane.id) }}" 
                   style="background: #6c757d; color: white; padding: 12px var(--spacer-l); text-decoration: none; border-radius: 4px;">
                    Отмена
                </a>
            </div>
        </form>
    </div>

    <!-- Карта для редактирования -->
    <div>
        <h3>Редактировать маршрут на карте</h3>
        <div style="margin-bottom: 10px;">
            <button type="button" onclick="clearRoute()" style="background: #dc3545; color: white; border: none; padding: 8px var(--spacer-m); border-radius: 4px; margin-right: 10px;">
                Очистить линию
            </button>
            <button type="button" onclick="resetRoute()" style="background: #6c757d; color: white; border: none; padding: 8px var(--spacer-m); border-radius: 4px;">
                Восстановить
            </button>
        </div>
        <div id="editMap" style="height: 400px; border-radius: 8px; border: 1px solid #ccc;"></div>
        <p style="font-size: 14px; color: #666; margin-top: 10px;">
            Кликайте по карте для добавления точек. Кликните на существующую точку для удаления.
        </p>
    </div>
</div>

<script>
let editMap;
let currentPolyline = null;
let routePoints = [];
let originalGeometry = {{ bikelane.geometry | safe }};

document.addEventListener('DOMContentLoaded', function() {
    // Инициализируем карту
    editMap = L.map('editMap').setView([43.2565, 76.9286], 12);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(editMap);
    
    // Загружаем существующую геометрию
    if (originalGeometry && originalGeometry.coordinates) {
        routePoints = originalGeometry.coordinates.map(coord => [coord[1], coord[0]]);
        drawRoute();
        editMap.fitBounds(L.polyline(routePoints).getBounds(), { padding: [20, 20] });
    }
    
    // Обработчик клика по карте
    editMap.on('click', function(e) {
        addPoint(e.latlng);
    });
});

function addPoint(latlng) {
    routePoints.push([latlng.lat, latlng.lng]);
    drawRoute();
    updateGeometryInput();
}

function drawRoute() {
    // Удаляем старую линию
    if (currentPolyline) {
        editMap.removeLayer(currentPolyline);
    }
    
    if (routePoints.length > 1) {
        // Рисуем новую линию
        currentPolyline = L.polyline(routePoints, {
            color: '#007bff',
            weight: 4,
            opacity: 0.8
        }).addTo(editMap);
        
        // Добавляем маркеры для точек
        routePoints.forEach(function(point, index) {
            L.circleMarker(point, {
                color: '#dc3545',
                fillColor: '#dc3545',
                fillOpacity: 0.8,
                radius: 6
            }).addTo(editMap).on('click', function() {
                removePoint(index);
            });
        });
    } else if (routePoints.length === 1) {
        // Показываем одну точку
        L.circleMarker(routePoints[0], {
            color: '#007bff',
            fillColor: '#007bff',
            fillOpacity: 0.8,
            radius: 8
        }).addTo(editMap);
    }
}

function removePoint(index) {
    routePoints.splice(index, 1);
    
    // Очищаем все слои и перерисовываем
    editMap.eachLayer(function(layer) {
        if (layer !== editMap._layers[Object.keys(editMap._layers)[0]]) { // Не удаляем тайлы
            editMap.removeLayer(layer);
        }
    });
    
    drawRoute();
    updateGeometryInput();
}

function clearRoute() {
    routePoints = [];
    if (currentPolyline) {
        editMap.removeLayer(currentPolyline);
        currentPolyline = null;
    }
    
    // Очищаем все маркеры
    editMap.eachLayer(function(layer) {
        if (layer !== editMap._layers[Object.keys(editMap._layers)[0]]) {
            editMap.removeLayer(layer);
        }
    });
    
    updateGeometryInput();
}

function resetRoute() {
    if (originalGeometry && originalGeometry.coordinates) {
        routePoints = originalGeometry.coordinates.map(coord => [coord[1], coord[0]]);
        
        // Очищаем карту
        editMap.eachLayer(function(layer) {
            if (layer !== editMap._layers[Object.keys(editMap._layers)[0]]) {
                editMap.removeLayer(layer);
            }
        });
        
        drawRoute();
        updateGeometryInput();
    }
}

function updateGeometryInput() {
    if (routePoints.length > 0) {
        const geometry = {
            type: "LineString",
            coordinates: routePoints.map(point => [point[1], point[0]]) // [lng, lat]
        };
        document.getElementById('geometryInput').value = JSON.stringify(geometry);
    } else {
        document.getElementById('geometryInput').value = '';
    }
}
</script>
{% endblock %}
