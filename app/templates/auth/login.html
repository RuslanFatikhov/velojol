{% extends "base.html" %}

{% block title %}Вход | Velojol{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="island ml-mr-auto">
        <div class="vstack gap-m pt-m">
            <h1 class="prime100">Войти в Velojol</h1>
            <p class="secondary100">Выберите удобный способ входа</p>
        </div>

        <div class="vstack gap-s">
            <a class="button__label btn_telegram"
               id="telegram-login-button"
               href="{{ url_for('auth.telegram_login', next=request.args.get('next')) }}">
                <img src="{{ url_for('static', filename='img/icon/telegram.svg') }}"
                     alt=""
                     class="provider-icon"
                     aria-hidden="true">
                Войти через Telegram
            </a>

            <a class="button__label"
               href="{{ url_for('auth.google_login', next=request.args.get('next')) }}">
                <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.4-.18-2.07H12v3.92h5.38a4.6 4.6 0 0 1-2 3.02v2.54h3.24c1.9-1.75 2.98-4.32 2.98-7.41Z"/>
                    <path fill="#34A853" d="M12 22c2.7 0 4.98-.9 6.63-2.36l-3.24-2.54c-.9.6-2.05.96-3.39.96-2.61 0-4.82-1.77-5.61-4.14H3.04v2.62A10 10 0 0 0 12 22Z"/>
                    <path fill="#FBBC05" d="M6.39 13.92A6.02 6.02 0 0 1 6.07 12c0-.67.12-1.32.32-1.92V7.46H3.04A10 10 0 0 0 2 12c0 1.63.39 3.18 1.04 4.54l3.35-2.62Z"/>
                    <path fill="#EA4335" d="M12 5.94c1.47 0 2.79.51 3.83 1.5l2.87-2.88A9.64 9.64 0 0 0 12 2a10 10 0 0 0-8.96 5.46l3.35 2.62C7.18 7.71 9.39 5.94 12 5.94Z"/>
                </svg>
                Войти через Google
            </a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
{% if config.TELEGRAM_OAUTH_ENABLED %}
<script src="https://oauth.telegram.org/js/telegram-login.js?3"></script>
<script>
(() => {
    const button = document.getElementById('telegram-login-button');
    if (!button) return;

    button.addEventListener('click', (event) => {
        if (!window.Telegram || !window.Telegram.Login) return;

        event.preventDefault();
        window.Telegram.Login.auth(
            {
                client_id: Number({{ config.TELEGRAM_CLIENT_ID | tojson }}),
                scope: ['profile'],
                nonce: {{ telegram_login_nonce | tojson }}
            },
            (authData) => {
                if (!authData || authData.error || !authData.id_token) return;

                const form = document.createElement('form');
                form.method = 'post';
                form.action = {{ url_for('auth.telegram_callback') | tojson }};

                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = 'id_token';
                input.value = authData.id_token;
                form.appendChild(input);

                document.body.appendChild(form);
                form.submit();
            }
        );
    });
})();
</script>
{% endif %}
{% endblock %}
